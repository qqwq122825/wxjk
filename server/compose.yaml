services:
  monitor:
    build:
      context: ..
      dockerfile: server/Dockerfile
    environment:
      LISTEN_ADDR: 0.0.0.0:8080
      DATA_DIR: /data
      COOKIE_SECURE: "true"
      SETUP_TOKEN: "${SETUP_TOKEN:?Set SETUP_TOKEN in server/.env}"
      ENROLLMENT_TOKEN: "${ENROLLMENT_TOKEN:-}"
    volumes:
      - monitor-data:/data
    expose:
      - "8080"
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment:
      MONITOR_DOMAIN: "${MONITOR_DOMAIN:?Set MONITOR_DOMAIN in server/.env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - monitor
    restart: unless-stopped
volumes:
  monitor-data:
  caddy-data:
  caddy-config:
